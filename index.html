<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1e">
<title>두뇌 퍼즐 던전</title>
<style>
/* ===== 기본 ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  --c1:#2b3a67;--c2:#0a0f1e;--accent:#ffd54a;--accent2:#ff8f3d;--panel:rgba(255,255,255,.1);
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
  font-size:20px;line-height:1.35;color:#fff;overflow:hidden;
  background-color:var(--c2);
  background-image:radial-gradient(circle at 50% 15%,var(--c1),var(--c2) 75%);
  background-size:cover;background-position:center;background-repeat:no-repeat;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
body.theme-moss{--c1:#2e7d5b;--c2:#071a12;background-image:linear-gradient(rgba(4,14,9,.45),rgba(4,14,9,.78)),url(assets/bg/floor-moss.webp)}
body.theme-ice{--c1:#3b82c4;--c2:#071527;background-image:linear-gradient(rgba(5,15,35,.45),rgba(5,15,35,.78)),url(assets/bg/floor-ice.webp)}
body.theme-lava{--c1:#c2410c;--c2:#1f0702;background-image:linear-gradient(rgba(30,6,2,.45),rgba(30,6,2,.78)),url(assets/bg/floor-lava.webp)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation}
.hidden{display:none!important}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
#app{position:fixed;inset:0}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));overflow-y:auto;overflow-x:hidden}
.screen.active{display:flex;animation:screenIn .45s cubic-bezier(.2,.9,.3,1.15)}
@keyframes screenIn{from{opacity:0;transform:scale(.94) translateY(24px)}to{opacity:1;transform:none}}
h1,h2,h3{margin:0;font-weight:900}
h2{font-size:clamp(26px,4.5vw,36px);text-shadow:0 3px 0 rgba(0,0,0,.35);text-align:center}
p{margin:0}

/* ===== 버튼 ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:64px;padding:0 28px;border-radius:22px;font-size:24px;font-weight:800;background:linear-gradient(#fff,#e6e9f2);color:#223;box-shadow:0 6px 0 #9aa3b8,0 10px 20px rgba(0,0,0,.3);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #9aa3b8}
.btn.primary{background:linear-gradient(#ffe27a,#ffb300);color:#4a2a00;box-shadow:0 6px 0 #b77800,0 10px 20px rgba(0,0,0,.3)}
.btn.primary:active{box-shadow:0 1px 0 #b77800}
.btn.big{min-height:76px;font-size:28px;padding:0 40px}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.35);min-height:56px;font-size:20px}
.btn.ghost:active{box-shadow:none}
.btn.small{min-height:56px;font-size:20px;padding:0 20px}
.btn:disabled{opacity:.45;filter:grayscale(.6);pointer-events:none}
.icon-btn{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.16);font-size:28px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.3);flex:none}
.icon-btn:active{transform:translateY(3px);box-shadow:none}
.icon-btn.used{opacity:.35}
.icon-btn img{width:70%;height:70%;object-fit:contain}
.star-img{display:inline-block;width:1.15em;height:1.15em;vertical-align:-0.22em;background:url(assets/ui/star.webp) center/contain no-repeat}
.corner{position:absolute;top:14px;right:14px}
.pill{background:rgba(0,0,0,.35);border-radius:999px;padding:8px 16px;font-weight:800;font-size:20px;white-space:nowrap}

/* ===== 공통 애니메이션 ===== */
@keyframes flicker{from{transform:scale(1) rotate(-4deg)}to{transform:scale(1.12) rotate(5deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-8px)}}
@keyframes glow{from{box-shadow:0 0 10px 2px rgba(255,213,74,.4)}to{box-shadow:0 0 30px 10px rgba(255,213,74,.9)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
@keyframes jump{0%{transform:translateY(0)}30%{transform:translateY(-40px) scale(1.1)}55%{transform:translateY(0)}70%{transform:translateY(-16px)}100%{transform:translateY(0)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.25);opacity:1}100%{transform:scale(1)}}
@keyframes popIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.06)}}
.shake{animation:shake .45s}

/* ===== 타이틀 ===== */
#s-title{gap:10px;justify-content:flex-end;padding-bottom:max(5vh,28px);background:linear-gradient(rgba(5,8,20,0) 30%,rgba(5,8,20,.85) 72%),url(assets/bg/title.webp) center/cover no-repeat}
.title{font-size:clamp(40px,8vw,76px);font-weight:900;letter-spacing:-1px;background:linear-gradient(#fff6c2,#ffb300 70%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #6b3d00) drop-shadow(0 8px 16px rgba(0,0,0,.5));animation:float 3s ease-in-out infinite;text-align:center}
.sub{font-size:clamp(18px,2.6vw,24px);opacity:.9;text-align:center}
.diff{display:flex;gap:8px;background:rgba(0,0,0,.3);padding:6px;border-radius:999px}
.diff button{min-width:104px;min-height:56px;padding:0 16px;border-radius:999px;font-size:20px;font-weight:800;opacity:.75}
.diff button.on{background:#fff;color:#223;opacity:1;box-shadow:0 3px 0 #9aa3b8}
.diff-label{font-size:18px;opacity:.85}

/* ===== 모험 준비 (인원·방식·탐험가) ===== */
#s-select{justify-content:flex-start;padding-top:18px;gap:16px}
.setup-block{width:100%;max-width:760px;display:flex;flex-direction:column;align-items:center;gap:8px}
.setup-label{font-size:22px;font-weight:800;opacity:.9}
.count-row,.mode-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.count-btn{min-width:92px;min-height:78px;border-radius:20px;background:rgba(255,255,255,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;line-height:1.1;border:3px solid transparent;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.count-btn span{font-size:18px;font-weight:800}
.count-btn.on,.mode-btn.on{border-color:var(--accent);background:rgba(255,213,74,.22)}
.mode-btn{min-width:220px;min-height:86px;border-radius:20px;background:rgba(255,255,255,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 16px;border:3px solid transparent;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.mode-btn b{font-size:24px}.mode-btn small{font-size:16px;opacity:.85}
.pcards{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:100%}
.pcard{background:rgba(0,0,0,.3);border-radius:22px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;align-items:center;min-width:320px;border:3px solid transparent}
.pcard.ready{border-color:rgba(255,213,74,.6)}
.pcard-head{display:flex;align-items:center;gap:10px}
.pcard-num{font-weight:900;font-size:19px;background:var(--accent);color:#4a2a00;border-radius:999px;padding:5px 12px;white-space:nowrap}
.pcard-name{font:inherit;font-size:20px;font-weight:700;width:190px;min-height:48px;border-radius:14px;border:0;padding:0 12px;background:#fff;color:#223;text-align:center}
.pcard-chars{display:flex;gap:12px}
.pc{width:68px;height:68px;border-radius:50%;background:var(--cc);position:relative;border:4px solid transparent;box-shadow:0 4px 0 rgba(0,0,0,.3);transition:transform .15s}
.pc img{position:absolute;left:50%;bottom:-2px;width:122%;height:122%;transform:translateX(-50%);object-fit:contain}
.pc.on{border-color:#fff;transform:scale(1.12)}
.pc.taken{opacity:.25;pointer-events:none}

/* ===== 참가자 칩·배지·순위 ===== */
.mini{width:36px;height:36px;border-radius:50%;background:var(--cc,#ff9f43);position:relative;overflow:hidden;flex:none;display:inline-block;vertical-align:middle}
.mini img{position:absolute;left:50%;top:2px;width:120%;height:120%;transform:translateX(-50%);object-fit:contain}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%;max-width:640px}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);border-radius:999px;padding:4px 12px 4px 4px;font-weight:800;font-size:18px;border:2px solid transparent;white-space:nowrap}
.chip.turn{border-color:var(--accent);background:rgba(255,213,74,.25)}
.chip.rank1{border-color:#ffd54a}
.door-badge{position:absolute;top:2px;left:2px;width:30px;height:30px;border-radius:50%;background:var(--cc);overflow:hidden;border:2px solid #fff;z-index:2}
.door-badge img{position:absolute;left:50%;top:1px;width:120%;height:120%;transform:translateX(-50%);object-fit:contain}
.rank-list{display:flex;flex-direction:column;gap:8px;width:min(92vw,440px)}
.rank-row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.12);border-radius:16px;padding:8px 14px;font-size:22px;font-weight:800}
.rank-row.first{background:rgba(255,213,74,.3);border:2px solid var(--accent)}
.rank-row .rk{min-width:64px;font-size:22px}
.rank-row .nm{flex:1}

/* ===== 던전 지도 ===== */
#s-map{justify-content:flex-start;padding-top:20px}
.map-top{display:flex;align-items:center;gap:12px;width:100%;max-width:640px;justify-content:space-between}
.map-top h2{white-space:nowrap}
@media (max-width:560px){.map-top{flex-wrap:wrap;gap:8px 12px}.map-top h2{width:100%;order:-1}}
.floors{display:flex;flex-direction:column;gap:12px;width:100%;max-width:640px;flex:1;justify-content:center}
.floor{border-radius:22px;padding:12px 14px 34px;background:var(--panel);position:relative;transition:transform .3s}
.floor.t-moss{background:linear-gradient(135deg,rgba(46,125,91,.55),rgba(0,0,0,.3))}
.floor.t-ice{background:linear-gradient(135deg,rgba(59,130,196,.55),rgba(0,0,0,.3))}
.floor.t-lava{background:linear-gradient(135deg,rgba(194,65,12,.55),rgba(0,0,0,.3))}
.floor.locked{opacity:.45;filter:grayscale(.5)}
.floor.cur{border:3px solid var(--accent);box-shadow:0 0 24px rgba(255,213,74,.35);transform:scale(1.02)}
.floor.done{opacity:.8}
.floor-name{font-weight:900;font-size:22px;margin-bottom:8px}
.doors{display:flex;justify-content:space-around;flex-wrap:wrap;gap:6px}
.door{position:relative;width:100px;height:104px;display:flex;align-items:flex-end;justify-content:center}
.door-face{width:100px;height:100px;background:url(assets/ui/door-closed.webp) center/contain no-repeat}
.door.done .door-face{background-image:url(assets/ui/door-open.webp)}
.door.cur .door-face{animation:glowDrop 1.2s infinite alternate}
.door.locked .door-face{background-image:url(assets/ui/door-locked.webp);opacity:.7}
@keyframes glowDrop{from{filter:drop-shadow(0 0 4px rgba(255,213,74,.5))}to{filter:drop-shadow(0 0 18px rgba(255,213,74,1))}}
.door-hero{position:absolute;bottom:-6px;left:50%;margin-left:-36px;width:72px;height:72px;animation:bob .7s infinite alternate ease-in-out;filter:drop-shadow(0 4px 4px rgba(0,0,0,.5))}
.door-hero img{width:100%;height:100%;object-fit:contain}
.door-hero .hero-torch{position:absolute;right:-28px;top:-12px;width:36px;height:36px;animation:flicker .35s infinite alternate}
.door-stars{position:absolute;bottom:-26px;font-size:16px;white-space:nowrap;display:flex;gap:2px}

/* ===== 방(퍼즐) ===== */
#s-room{justify-content:flex-start;padding-top:12px;gap:10px}
.room-top{display:flex;align-items:center;gap:8px;width:100%;max-width:900px;flex-wrap:wrap;justify-content:center}
.dots{display:flex;gap:6px}
.dots span{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.25)}
.dots span.done{background:var(--accent)}
.dots span.cur{background:#fff;box-shadow:0 0 10px #fff}
.room-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;min-height:0}
.side{display:flex;align-items:center;gap:10px;width:100%;max-width:640px;justify-content:center}
.avatar{width:84px;height:84px;border-radius:50%;background:var(--cc,#ff9f43);box-shadow:0 5px 0 rgba(0,0,0,.3);flex:none;position:relative;margin-top:16px}
.avatar img{position:absolute;left:50%;bottom:-2px;width:126%;height:126%;transform:translateX(-50%);object-fit:contain;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.avatar.jump{animation:jump .8s}
.avatar.oops{animation:shake .5s}
.avatar.oops::after{content:"앗!";position:absolute;top:-24px;right:-12px;font-size:22px;font-weight:900;color:var(--accent);animation:popIn .2s}
.bubble{background:#fff;color:#223;border-radius:20px;padding:12px 16px;font-size:20px;font-weight:700;position:relative;max-width:460px}
.bubble.pop{animation:popIn .25s}
.bubble::before{content:"";position:absolute;left:-10px;top:50%;margin-top:-10px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.puzzle-wrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0}
#puzzle{width:min(96vw,620px)}
@media (orientation:landscape) and (min-width:760px){
  .room-body{flex-direction:row;align-items:center;justify-content:center;gap:24px;max-width:1100px}
  .side{flex-direction:column;width:220px;flex:none}
  .bubble::before{left:50%;top:-10px;margin:0 0 0 -10px;border:10px solid transparent;border-bottom-color:#fff;border-top:0}
  #puzzle{width:min(62vw,620px)}
}
.room-overlay{position:absolute;inset:0;background:rgba(5,8,20,.72);display:flex;align-items:center;justify-content:center;z-index:20;animation:popIn .25s}
.card{background:linear-gradient(#fff,#eef1f8);color:#223;border-radius:30px;padding:28px 32px;display:flex;flex-direction:column;align-items:center;gap:16px;min-width:min(90vw,380px);box-shadow:0 20px 50px rgba(0,0,0,.5);text-align:center}
.big-msg{font-size:40px;font-weight:900}
.star-row{display:flex;gap:8px}
.star-row span{width:64px;height:64px;background:url(assets/ui/star.webp) center/contain no-repeat;opacity:.2;filter:grayscale(1);transform:scale(.8)}
.star-row span.on{opacity:1;filter:none;animation:pop .45s forwards}
.modal{position:fixed;inset:0;background:rgba(5,8,20,.78);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal .card{max-width:540px;animation:popIn .3s}
.modal-icon{height:110px}
.modal-icon img{width:110px;height:110px;object-fit:contain}
.card .btn.ghost{background:#dde2ee;color:#223;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.card h3{font-size:28px}
.card p{font-size:21px;line-height:1.5}

/* ===== 층 클리어 / 결과 ===== */
.chest{position:relative;width:min(60vw,280px);aspect-ratio:1;margin-top:10px}
.chest img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .35s,transform .5s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(0 10px 14px rgba(0,0,0,.45))}
.chest .chest-open{opacity:0;transform:scale(.7)}
.chest .glow{position:absolute;left:-10%;right:-10%;top:-15%;height:90%;background:radial-gradient(ellipse at 50% 70%,rgba(255,246,176,.9),rgba(255,214,74,0) 65%);opacity:0;transition:opacity .6s}
.chest.open .chest-closed{opacity:0}
.chest.open .chest-open{opacity:1;transform:scale(1)}
.chest.open .glow{opacity:1}
.chest.shake{animation:shake .4s 3}
.big-count{font-size:44px;font-weight:900}
.big-count small{font-size:22px;opacity:.8}
.trophy{width:min(50vw,240px);height:min(50vw,240px);object-fit:contain;animation:float 2.5s ease-in-out infinite;filter:drop-shadow(0 10px 20px rgba(0,0,0,.5))}
.trophy.gold{filter:drop-shadow(0 0 30px rgba(255,213,74,.9))}
.trophy.silver{filter:drop-shadow(0 0 30px rgba(223,230,243,.9))}
.trophy.bronze{filter:drop-shadow(0 0 30px rgba(208,138,74,.9))}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.result-msg{font-size:22px;text-align:center;max-width:520px}

/* ===== 퍼즐: 패턴 찾기 ===== */
.pz-pattern{display:flex;flex-direction:column;align-items:center;gap:18px}
.pt-seq{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;background:rgba(0,0,0,.3);padding:12px;border-radius:24px}
.pt-tile{--ts:clamp(56px,13vw,86px);width:var(--ts);height:var(--ts);border-radius:18px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;padding:8%}
.pt-tile.q{font-size:40px;font-weight:900;color:var(--accent);border:3px dashed var(--accent);animation:pulse .8s infinite alternate}
.pt-options{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.pt-options .pt-tile{--ts:clamp(90px,22vw,130px);background:#fff;box-shadow:0 6px 0 #b9c0d0;transition:transform .1s,opacity .3s}
.pt-options .pt-tile:active{transform:translateY(4px);box-shadow:0 2px 0 #b9c0d0}
.pt-options .pt-tile.off{opacity:.25;pointer-events:none}
.pt-options .pt-tile.win{box-shadow:0 0 0 6px var(--accent),0 6px 0 #b9c0d0;animation:pop .5s}
.shape{display:block}
.shape.s{width:55%;height:55%}.shape.m{width:75%;height:75%}.shape.l{width:98%;height:98%}
.shape.circle{border-radius:50%}
.shape.square{border-radius:14%}
.shape.triangle{clip-path:polygon(50% 4%,97% 96%,3% 96%)}
.shape.star{clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.shape.diamond{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}

/* ===== 퍼즐: 불빛 기억 ===== */
.pz-simon{display:flex;flex-direction:column;align-items:center;gap:14px}
.sm-status{font-size:26px;font-weight:900;min-height:36px}
.sm-stages{display:flex;gap:8px}
.sm-dot{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.25)}
.sm-dot.on{background:var(--accent);box-shadow:0 0 10px var(--accent)}
.sm-grid{display:grid;gap:12px;width:min(90vw,52vh,460px)}
.sm-pad{aspect-ratio:1;border-radius:22px;background:var(--pc);opacity:.45;box-shadow:0 6px 0 rgba(0,0,0,.4);transition:opacity .12s,transform .12s,box-shadow .12s}
.sm-pad.lit{opacity:1;transform:scale(1.06);box-shadow:0 0 30px var(--pc),0 6px 0 rgba(0,0,0,.4)}
.sm-grid.watch .sm-pad{pointer-events:none}
.sm-pad:active{opacity:1}

/* ===== 퍼즐: 그림 스도쿠 ===== */
.pz-sudoku{display:flex;flex-direction:column;align-items:center;gap:14px}
.sd-grid{display:grid;width:min(92vw,50vh,500px);aspect-ratio:1;background:#3a2a1c;border:5px solid #ffe8b0;border-radius:12px;overflow:hidden}
.sd-cell{display:flex;align-items:center;justify-content:center;background:#fff8e8;border:2px solid #d6c4a2;font-size:clamp(26px,6vw,44px);transition:background .15s;line-height:1}
.sd-grid.n6 .sd-cell{font-size:clamp(20px,4.5vw,34px)}
.sd-cell.fixed{background:#efe2c8}
.sd-cell.sel{background:#ffe27a;box-shadow:inset 0 0 0 4px #ffb300}
.sd-cell.bad{background:#ffb3b3;animation:shake .4s}
.sd-cell.hinted{background:#d8f5d0}
.sd-cell .sd-v{display:block;width:78%;height:78%;object-fit:contain}
.sd-cell.pop .sd-v{animation:pop .3s}
.sd-cell.br{border-right:5px solid #3a2a1c}
.sd-cell.bb{border-bottom:5px solid #3a2a1c}
.sd-grid.win .sd-cell{background:#d8f5d0}
.sd-palette{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.sd-key{width:66px;height:66px;border-radius:18px;background:#fff;font-size:36px;box-shadow:0 5px 0 #b9c0d0;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.sd-key img{width:78%;height:78%;object-fit:contain}
.sd-key:active{transform:translateY(4px);box-shadow:0 1px 0 #b9c0d0}

/* ===== 퍼즐: 로봇 길 찾기 ===== */

.rb-board{position:relative;display:grid;width:min(90vw,42vh,440px);aspect-ratio:1;background:#1f2a3a;border:5px solid #9fb3cc;border-radius:12px;overflow:hidden;--n:3}
.rb-cell{position:relative;border:2px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:clamp(24px,6vw,40px);background:#2b3b52;line-height:1}
.rb-cell.wall{background:#5a4636}

.rb-robot{position:absolute;left:0;top:0;width:calc(100%/var(--n));height:calc(100%/var(--n));display:flex;align-items:center;justify-content:center;font-size:clamp(26px,6.5vw,44px);line-height:1;transform:translate(calc(var(--x)*100%),calc(var(--y)*100%)) rotate(var(--r));transition:transform .4s ease-in-out;z-index:2}
.rb-robot .face{position:absolute;top:3px;left:50%;margin-left:-8px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:12px solid var(--accent)}
.rb-bot{display:block;width:82%;height:82%;object-fit:contain}

.rb-cmd:active{transform:translateY(4px);box-shadow:0 1px 0 #b9c0d0}

<script>
(() => {
'use strict';
/* ---------- 도우미 ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const rand = n => Math.floor(Math.random() * n);
const pick = a => a[rand(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const range = n => [...Array(n).keys()];
const wait = ms => new Promise(r => setTimeout(r, ms));
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

/* ---------- 소리 (Web Audio, 음원 파일 없음) ---------- */
const PAD_TONES = [262, 294, 330, 392, 440, 523, 587, 659, 784];
const Sound = {
  ctx: null, on: true,
  init() {
    if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(freq, dur = 0.15, type = 'sine', vol = 0.2, delay = 0, slide = 0) {
    if (!this.on || !this.ctx) return;
    const c = this.ctx, t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  play(name) {
    if (!this.on) return; this.init(); if (!this.ctx) return;
    const t = (...a) => this.tone(...a);
    switch (name) {
      case 'tap': t(700, 0.05, 'square', 0.05); break;
      case 'correct': [523, 659, 784, 1047].forEach((f, i) => t(f, 0.18, 'triangle', 0.22, i * 0.09)); break;
      case 'wrong': t(220, 0.25, 'sawtooth', 0.12, 0, 150); t(180, 0.3, 'sawtooth', 0.1, 0.12, 120); break;
      case 'star': t(1200, 0.12, 'sine', 0.18); t(1800, 0.18, 'sine', 0.14, 0.06); break;
      case 'ding': t(880, 0.1, 'triangle', 0.2); t(1320, 0.2, 'triangle', 0.18, 0.08); break;
      case 'hint': t(900, 0.1, 'sine', 0.15); t(1200, 0.1, 'sine', 0.15, 0.1); t(1500, 0.15, 'sine', 0.15, 0.2); break;
      case 'door': t(70, 0.5, 'sawtooth', 0.15, 0, 160); break;
      case 'chest': [660, 880, 1100, 1320, 1760].forEach((f, i) => t(f, 0.2, 'sine', 0.18, i * 0.07)); break;
      case 'fanfare': [[523, 0], [523, .15], [523, .3], [659, .45], [784, .75], [659, .95], [784, 1.1]].forEach(([f, d]) => t(f, 0.22, 'square', 0.1, d)); break;
      case 'step': t(400, 0.06, 'square', 0.06); break;
      case 'turn': t(500, 0.08, 'triangle', 0.08, 0, 760); break;
      case 'bump': t(120, 0.2, 'sawtooth', 0.15, 0, 80); break;
      default: if (name.startsWith('pad')) t(PAD_TONES[+name.slice(3)] || 440, 0.35, 'triangle', 0.2);
    }
  }
};

/* ---------- 파티클 효과 (캔버스) ---------- */
const FX = {
  c: null, ctx: null, parts: [], raf: 0,
  init() {
    this.c = $('#fx'); this.ctx = this.c.getContext('2d');
    const rs = () => { const d = devicePixelRatio || 1; this.c.width = innerWidth * d; this.c.height = innerHeight * d; this.ctx.setTransform(d, 0, 0, d, 0, 0); };
    addEventListener('resize', rs); rs();
  },
  burst(x, y, { count = 40, colors = ['#ffd54a', '#ff6b6b', '#4dabf7', '#69db7c', '#da77f2', '#ffa94d'], speed = 7, gravity = 0.18, life = 70, shapes = ['rect', 'circle'] } = {}) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2, v = speed * (0.4 + Math.random() * 0.8);
      this.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, g: gravity, life, color: pick(colors), size: 6 + Math.random() * 8, shape: pick(shapes), rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3 });
    }
    if (!this.raf) this.loop();
  },
  loop() {
    this.raf = requestAnimationFrame(() => this.loop());
    const ctx = this.ctx; ctx.clearRect(0, 0, innerWidth, innerHeight);
    this.parts = this.parts.filter(p => p.life > 0);
    if (!this.parts.length) { cancelAnimationFrame(this.raf); this.raf = 0; return; }
    for (const p of this.parts) {
      p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= 0.98; p.life--; p.rot += p.vr;
      ctx.save(); ctx.globalAlpha = Math.min(1, p.life / 20); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color;
      if (p.shape === 'circle') { ctx.beginPath(); ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2); ctx.fill(); }
      else if (p.shape === 'star') { ctx.beginPath(); for (let i = 0; i < 10; i++) { const r = i % 2 ? p.size * 0.35 : p.size * 0.8, a = i * Math.PI / 5 - Math.PI / 2; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.closePath(); ctx.fill(); }
      else ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      ctx.restore();
    }
  },
  confetti() { this.burst(innerWidth / 2, innerHeight * 0.35, { count: 70 }); },
  stars(x, y) { this.burst(x, y, { count: 40, colors: ['#ffd54a', '#fff3b0', '#ffb400'], shapes: ['star'], speed: 8, gravity: 0.12, life: 90 }); },
  fireworks() { let n = 0; const t = setInterval(() => { this.burst(innerWidth * (0.2 + Math.random() * 0.6), innerHeight * (0.15 + Math.random() * 0.4), { count: 50, speed: 6, gravity: 0.1, life: 80, shapes: ['circle', 'star'] }); if (++n >= 6) clearInterval(t); }, 350); }
};

/* ---------- 데이터 ---------- */
const CHARACTERS = [
  { id: 'fox', emoji: '🦊', name: '여우', color: '#ff9f43' },
  { id: 'penguin', emoji: '🐧', name: '펭귄', color: '#54a0ff' },
  { id: 'cat', emoji: '🐱', name: '고양이', color: '#feca57' },
  { id: 'dino', emoji: '🦖', name: '공룡', color: '#1dd1a1' },
];
const THEMES = [
  { id: 'moss', name: '이끼 동굴', icon: '🌿' },
  { id: 'ice', name: '얼음 동굴', icon: '❄️' },
  { id: 'lava', name: '용암 동굴', icon: '🌋' },
];
const charImg = (id, pose) => `assets/char/${id}${pose ? '-' + pose : ''}.webp`;
const starIcons = n => n ? '<i class="star-img"></i>'.repeat(n) : '－';
const DIFFS = { easy: { label: '쉬움', level: 1 }, normal: { label: '보통', level: 2 }, hard: { label: '어려움', level: 3 } };
const FLOORS = 3, ROOMS = 3;
const Puzzles = {};

/* ---------- 퍼즐 1: 패턴 찾기 ---------- */
const SHAPES = ['circle', 'square', 'triangle', 'star', 'diamond'];
const COLORS = ['#ff5a5f', '#3d8bff', '#ffd23f', '#2ecc71', '#b56cff'];
const SIZES = ['s', 'm', 'l'];
Puzzles.pattern = {
  name: '패턴 찾기', icon: 'assets/ui/crystal.webp',
  bubble: '규칙을 찾아서 물음표에 올 모양을 골라!',
  intro: '모양들이 어떤 규칙으로 늘어서 있는지 잘 보고, 물음표 자리에 들어갈 모양을 아래에서 골라요.',
  generate(level) {
    const n = level === 1 ? 4 : level === 2 ? 5 : 6;
    const colors = shuffle(COLORS), shapes = shuffle(SHAPES);
    const rule = level === 1 ? pick([{ pc: 2, ps: 1 }, { pc: 1, ps: 2 }, { pc: 3, ps: 1 }, { pc: 1, ps: 3 }])
      : level === 2 ? pick([{ pc: 2, ps: 3 }, { pc: 3, ps: 2 }, { pc: 2, ps: 2 }, { pc: 3, ps: 3 }, { pc: 4, ps: 1 }])
      : pick([{ pc: 2, ps: 3, psz: 2 }, { pc: 3, ps: 2, psz: 3 }, { pc: 4, ps: 1, psz: 2 }, { pc: 2, ps: 4 }, { pc: 3, ps: 4 }]);
    const item = i => ({ color: colors[i % rule.pc], shape: shapes[i % rule.ps], size: rule.psz ? SIZES[i % rule.psz] : 'm' });
    const seq = range(n).map(item), answer = item(n);
    const key = o => o.color + o.shape + o.size;
    const usedColors = [...new Set(seq.map(x => x.color))], usedShapes = [...new Set(seq.map(x => x.shape))];
    const colorPool = usedColors.length >= 2 ? usedColors : COLORS, shapePool = usedShapes.length >= 2 ? usedShapes : SHAPES;
    const mutations = level === 1 ? ['color', 'shape'] : rule.psz ? ['color', 'shape', 'size', 'both'] : ['color', 'shape', 'both'];
    const seen = new Set([key(answer)]), opts = [];
    for (let g = 0; g < 400 && opts.length < 3; g++) {
      const o = { ...answer }, m = pick(mutations);
      if (m === 'color' || m === 'both') o.color = pick(colorPool.filter(c => c !== answer.color).concat(g > 200 ? COLORS : []));
      if (m === 'shape' || m === 'both') o.shape = pick(shapePool.filter(s => s !== answer.shape).concat(g > 200 ? SHAPES : []));
      if (m === 'size') o.size = pick(SIZES.filter(s => s !== answer.size));
      if (!seen.has(key(o))) { seen.add(key(o)); opts.push(o); }
    }
    return { seq, answer, options: shuffle([answer, ...opts]), key };
  },
  mount(root, d, ctx) {
    const tile = (o, btn) => { const t = el(btn ? 'button' : 'div', 'pt-tile'); const s = el('span', `shape ${o.shape} ${o.size}`); s.style.background = o.color; t.appendChild(s); return t; };
    const wrap = el('div', 'pz-pattern'), row = el('div', 'pt-seq'), grid = el('div', 'pt-options');
    d.seq.forEach(o => row.appendChild(tile(o)));
    const q = el('div', 'pt-tile q', '?'); row.appendChild(q);
    const isAns = o => d.key(o) === d.key(d.answer);
    const btns = d.options.map(o => {
      const b = tile(o, true);
      b.addEventListener('click', () => {
        if (ctx.locked() || b.classList.contains('off')) return;
        ctx.sfx('tap');
        if (isAns(o)) { b.classList.add('win'); q.replaceWith(tile(d.answer)); ctx.correct(); }
        else { b.classList.add('off', 'shake'); ctx.wrong(); }
      });
      grid.appendChild(b); return { b, o };
    });
    wrap.append(row, grid); root.appendChild(wrap);
    return {
      hint() { const w = btns.filter(x => !isAns(x.o) && !x.b.classList.contains('off')); if (w.length) pick(w).b.classList.add('off'); },
      async showSolution() { btns.forEach(x => x.b.classList.add(isAns(x.o) ? 'win' : 'off')); q.replaceWith(tile(d.answer)); await wait(700); }
    };
  }
};

/* ---------- 퍼즐 2: 불빛 기억 ---------- */
const PAD_COLORS = ['#ff5a5f', '#3d8bff', '#ffd23f', '#2ecc71', '#b56cff', '#ff8c42', '#00d2d3', '#ff6ec7', '#c8ff4d'];
Puzzles.simon = {
  name: '불빛 기억', icon: 'assets/ui/bulb.webp',
  bubble: '불빛이 켜지는 순서를 잘 보고 똑같이 눌러!',
  intro: '불빛이 켜지는 순서를 잘 기억했다가, 똑같은 순서로 눌러요. 성공할 때마다 한 칸씩 길어져요!',
  generate(level) {
    const pads = level === 1 ? 4 : level === 2 ? 6 : 9, target = level === 1 ? 4 : level === 2 ? 6 : 8;
    return { pads, target, seq: range(target).map(() => rand(pads)), cols: pads === 4 ? 2 : 3 };
  },
  mount(root, d, ctx) {
    const wrap = el('div', 'pz-simon'), status = el('div', 'sm-status', '잘 봐! 👀'), stages = el('div', 'sm-stages'), grid = el('div', 'sm-grid');
    const dots = range(d.target).map(() => { const s = el('span', 'sm-dot'); stages.appendChild(s); return s; });
    grid.style.gridTemplateColumns = `repeat(${d.cols},1fr)`;
    const pads = range(d.pads).map(i => { const p = el('button', 'sm-pad'); p.style.setProperty('--pc', PAD_COLORS[i]); p.addEventListener('click', () => onTap(i)); grid.appendChild(p); return p; });
    wrap.append(status, stages, grid); root.appendChild(wrap);
    let stage = 1, pos = 0, input = false, run = 0;

/* ---------- 퍼즐 3: 그림 스도쿠 ---------- */
const FRUITS = ['apple', 'banana', 'grape', 'orange', 'strawberry', 'kiwi'];
Puzzles.sudoku = {
  name: '그림 스도쿠', icon: 'assets/fruit/apple.webp',
  bubble: '가로줄, 세로줄, 굵은 네모 안에 같은 과일이 없게 채워!',

  generate(level) {
    const size = level === 3 ? 6 : 4, br = 2, bc = size / 2;
    const blanks = level === 1 ? 5 : level === 2 ? 8 : 14;
    let g = range(size).map(r => range(size).map(c => (bc * (r % br) + Math.floor(r / br) + c) % size));
    const sym = shuffle(range(size)); g = g.map(row => row.map(v => sym[v]));
    const rowOrder = shuffle(range(size / br)).flatMap(b => shuffle(range(br)).map(i => b * br + i));
    g = rowOrder.map(r => g[r]);
    const colOrder = shuffle(range(size / bc)).flatMap(s => shuffle(range(bc)).map(i => s * bc + i));
    g = g.map(row => colOrder.map(c => row[c]));
    const solution = g, given = g.map(r => r.slice());
    shuffle(range(size * size)).slice(0, blanks).forEach(k => { given[Math.floor(k / size)][k % size] = -1; });

  },
  mount(root, d, ctx) {
    const N = d.size, wrap = el('div', 'pz-sudoku'), grid = el('div', 'sd-grid n' + N), palette = el('div', 'sd-palette');
    const fruitHtml = f => `<img class="sd-v" src="assets/fruit/${f}.webp" alt="">`;
    grid.style.gridTemplateColumns = `repeat(${N},1fr)`;
    const vals = d.given.map(r => r.slice()), cells = []; let sel = null;
    const idx = (r, c) => r * N + c;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const v = d.given[r][c], cell = el('div', 'sd-cell' + (v >= 0 ? ' fixed' : ''), v >= 0 ? fruitHtml(d.fruits[v]) : '');
      cell.dataset.v = v;
      if ((c + 1) % d.bc === 0 && c < N - 1) cell.classList.add('br');
      if ((r + 1) % d.br === 0 && r < N - 1) cell.classList.add('bb');
      cell.addEventListener('click', () => { if (ctx.locked() || d.given[r][c] >= 0) return; ctx.sfx('tap'); select(r, c); });
      grid.appendChild(cell); cells.push(cell);
    }
    const select = (r, c) => { sel = { r, c }; cells.forEach(x => x.classList.remove('sel')); cells[idx(r, c)].classList.add('sel'); };
    const nextEmpty = (r, c) => { for (let k = 1; k <= N * N; k++) { const i = (idx(r, c) + k) % (N * N), rr = Math.floor(i / N), cc = i % N; if (vals[rr][cc] < 0) return { r: rr, c: cc }; } return null; };
    const full = () => vals.every(row => row.every(x => x >= 0));
    const conflicts = () => {
      const bad = new Set(), groups = [];
      for (let i = 0; i < N; i++) { groups.push(range(N).map(c => [i, c])); groups.push(range(N).map(r => [r, i])); }
      for (let r0 = 0; r0 < N; r0 += d.br) for (let c0 = 0; c0 < N; c0 += d.bc) { const g = []; for (let r = r0; r < r0 + d.br; r++) for (let c = c0; c < c0 + d.bc; c++) g.push([r, c]); groups.push(g); }
      groups.forEach(g => { const seen = {}; g.forEach(([r, c]) => { const v = vals[r][c]; if (v < 0) return; if (seen[v] !== undefined) { bad.add(idx(r, c)); bad.add(seen[v]); } else seen[v] = idx(r, c); }); });
      return bad;
    };
    const checkAll = () => {
      const bad = conflicts();

      else { bad.forEach(i => cells[i].classList.add('bad')); ctx.wrong(); }
    };
    const put = (r, c, v) => {
      if (d.given[r][c] >= 0) return;
      vals[r][c] = v; const cell = cells[idx(r, c)];
      cell.innerHTML = v >= 0 ? fruitHtml(d.fruits[v]) : ''; cell.dataset.v = v; cell.classList.remove('bad'); cell.classList.remove('pop'); void cell.offsetWidth; cell.classList.add('pop');
      ctx.sfx('tap');
      if (v >= 0) { const nx = nextEmpty(r, c); if (nx) select(nx.r, nx.c); }
      if (full()) checkAll();

    d.fruits.forEach((f, i) => { const b = el('button', 'sd-key', `<img src="assets/fruit/${f}.webp" alt="">`); b.dataset.v = i; b.addEventListener('click', () => { if (ctx.locked() || !sel) return; put(sel.r, sel.c, i); }); palette.appendChild(b); });
    const eraser = el('button', 'sd-key', '🧽'); eraser.addEventListener('click', () => { if (ctx.locked() || !sel) return; put(sel.r, sel.c, -1); }); palette.appendChild(eraser);
    wrap.append(grid, palette); root.appendChild(wrap);
    const first = nextEmpty(N - 1, N - 1); if (first) select(first.r, first.c);

        if (full()) checkAll();
      },
      async showSolution() {
        for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (d.given[r][c] < 0) { const cell = cells[idx(r, c)]; cell.innerHTML = fruitHtml(d.fruits[d.solution[r][c]]); cell.dataset.v = d.solution[r][c]; cell.classList.remove('bad', 'sel'); cell.classList.add('hinted'); }

      }
    };
  }
};

/* ---------- 퍼즐 4: 로봇 길 찾기 ---------- */
const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]]; // 위, 오른쪽, 아래, 왼쪽
Puzzles.robot = {
  name: '로봇 길 찾기', icon: 'assets/robot/robot.webp',
  bubble: '명령 블록을 순서대로 넣고 실행해서 로봇을 보물까지 보내!',
  intro: '⬆️ 앞으로, ↩️ 왼쪽으로 돌기, ↪️ 오른쪽으로 돌기 블록을 순서대로 넣어요. ▶ 실행을 누르면 로봇이 그대로 움직여요. 💎 보물까지 가면 성공!',
  generate(level) {
    const size = level === 1 ? 3 : level === 2 ? 4 : 5, nObs = level === 1 ? 0 : level === 2 ? 1 : 3;
    const [minLen, maxLen] = level === 1 ? [2, 3] : level === 2 ? [3, 5] : [5, 8];
    const inside = (x, y) => x >= 0 && y >= 0 && x < size && y < size;
    for (let attempt = 0; attempt < 300; attempt++) {
      const start = { x: rand(size), y: rand(size) }, path = [start], used = new Set([start.x + ',' + start.y]);
      const len = minLen + rand(maxLen - minLen + 1); let ok = true;
      for (let i = 0; i < len; i++) {
        const cur = path[path.length - 1];
        const opts = shuffle([0, 1, 2, 3]).map(dI => ({ x: cur.x + DIRS[dI][0], y: cur.y + DIRS[dI][1] })).filter(p => inside(p.x, p.y) && !used.has(p.x + ',' + p.y));
        if (!opts.length) { ok = false; break; }
        path.push(opts[0]); used.add(opts[0].x + ',' + opts[0].y);
      }
      if (!ok) continue;
      const dirs = []; for (let i = 1; i < path.length; i++) { const dx = path[i].x - path[i - 1].x, dy = path[i].y - path[i - 1].y; dirs.push(DIRS.findIndex(d => d[0] === dx && d[1] === dy)); }
      const turns = dirs.filter((d, i) => i > 0 && d !== dirs[i - 1]).length;
      if (level >= 2 && turns < 1) continue;
      if (level === 1 && turns > 1) continue;
      const facing = level === 1 ? dirs[0] : rand(4);
      const prog = []; let f = facing;
      dirs.forEach(dI => { while (f !== dI) { if ((f + 1) % 4 === dI) { prog.push('R'); f = (f + 1) % 4; } else { prog.push('L'); f = (f + 3) % 4; } } prog.push('F'); });
      const free = []; for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!used.has(x + ',' + y)) free.push({ x, y });
      return { size, start, goal: path[path.length - 1], path, facing, prog, obstacles: shuffle(free).slice(0, nObs), limit: prog.length + (level === 1 ? 3 : 2) };
    }
    return { size, start: { x: 0, y: size - 1 }, goal: { x: 0, y: size - 3 }, path: [{ x: 0, y: size - 1 }, { x: 0, y: size - 2 }, { x: 0, y: size - 3 }], facing: 0, prog: ['F', 'F'], obstacles: [], limit: 5 };
  },
  mount(root, d, ctx) {
    const CMD = { F: { icon: '⬆️', label: '앞으로' }, L: { icon: '↩️', label: '왼쪽' }, R: { icon: '↪️', label: '오른쪽' } };
    const wrap = el('div', 'pz-robot'), board = el('div', 'rb-board'), progBox = el('div', 'rb-prog'), cmds = el('div', 'rb-cmds'), actions = el('div', 'rb-actions');
    board.style.setProperty('--n', d.size); board.style.gridTemplateColumns = `repeat(${d.size},1fr)`;
    const cellEls = [];
    for (let y = 0; y < d.size; y++) for (let x = 0; x < d.size; x++) {
      const c = el('div', 'rb-cell');
      if (d.obstacles.some(o => o.x === x && o.y === y)) { c.classList.add('wall'); c.innerHTML = '<img src="assets/robot/rock.webp" alt="">'; }
      if (d.goal.x === x && d.goal.y === y) { c.classList.add('goal'); c.innerHTML = '<img src="assets/robot/gem.webp" alt="">'; }
      board.appendChild(c); cellEls.push(c);
    }
    const robot = el('div', 'rb-robot', '<img class="rb-bot" src="assets/robot/robot.webp" alt=""><span class="face"></span>'); board.appendChild(robot);
    let pos = { ...d.start }, f = d.facing, ang = d.facing * 90, running = false;
    const prog = [];
    const place = () => { robot.style.setProperty('--x', pos.x); robot.style.setProperty('--y', pos.y); robot.style.setProperty('--r', ang + 'deg'); };
    const reset = () => { pos = { ...d.start }; f = d.facing; ang = d.facing * 90; place(); };
    const slots = range(d.limit).map(i => { const s = el('div', 'rb-slot'); s.addEventListener('click', () => { if (running || ctx.locked() || prog[i] === undefined) return; prog.splice(i, 1); ctx.sfx('tap'); renderProg(); }); progBox.appendChild(s); return s; });
    const renderProg = () => slots.forEach((s, i) => { s.textContent = prog[i] ? CMD[prog[i]].icon : ''; s.classList.toggle('filled', !!prog[i]); s.classList.remove('cur'); });
    Object.entries(CMD).forEach(([k, v]) => {
      const b = el('button', 'rb-cmd', `<span>${v.icon}</span><small>${v.label}</small>`);
      b.addEventListener('click', () => {
        if (running || ctx.locked()) return;
        if (prog.length >= d.limit) { progBox.classList.remove('shake'); void progBox.offsetWidth; progBox.classList.add('shake'); ctx.sfx('bump'); return; }
        prog.push(k); ctx.sfx('tap'); renderProg();
      });
      cmds.appendChild(b);
    });
    const runBtn = el('button', 'btn primary', '▶ 실행'), clearBtn = el('button', 'btn ghost small', '🧹 지우기');
    clearBtn.addEventListener('click', () => { if (running || ctx.locked()) return; prog.length = 0; renderProg(); ctx.sfx('tap'); });
    runBtn.addEventListener('click', () => { if (running || ctx.locked() || !prog.length) return; run(prog, true); });

    wrap.append(board, progBox, cmds, actions); root.appendChild(wrap);
    reset();

      running = true; reset(); await wait(350);
      let crashed = false;
      for (let i = 0; i < program.length; i++) {
        slots.forEach(s => s.classList.remove('cur')); if (slots[i]) slots[i].classList.add('cur');
        const cmd = program[i];
        if (cmd === 'L') { f = (f + 3) % 4; ang -= 90; place(); ctx.sfx('turn'); }
        else if (cmd === 'R') { f = (f + 1) % 4; ang += 90; place(); ctx.sfx('turn'); }
        else {
          const nx = pos.x + DIRS[f][0], ny = pos.y + DIRS[f][1];
          const blocked = nx < 0 || ny < 0 || nx >= d.size || ny >= d.size || d.obstacles.some(o => o.x === nx && o.y === ny);
          if (blocked) { robot.classList.add('bump'); ctx.sfx('bump'); await wait(500); robot.classList.remove('bump'); crashed = true; break; }
          pos = { x: nx, y: ny }; place(); ctx.sfx('step');
        }

      slots.forEach(s => s.classList.remove('cur'));
      const atGoal = !crashed && pos.x === d.goal.x && pos.y === d.goal.y;
      if (atGoal) { robot.classList.add('happy'); cellEls[d.goal.y * d.size + d.goal.x].classList.add('got'); if (count) ctx.correct(); }
      else if (count) { ctx.wrong(); await wait(600); if (!ctx.locked()) reset(); }
      running = false;
    };
    return {
      hint() { d.path.slice(1, -1).forEach(p => cellEls[p.y * d.size + p.x].classList.add('trail')); },
      async showSolution() { prog.length = 0; d.prog.forEach(c => prog.push(c)); renderProg(); d.path.slice(1, -1).forEach(p => cellEls[p.y * d.size + p.x].classList.add('trail')); await run(prog, false); },
      destroy() { running = true; }
    };
  }
};

// 모험 준비 화면에서 고른 인원·방식·탐험가
const Setup = { count: 1, mode: 'coop', players: range(4).map(() => ({ character: null, name: '' })) };
const chOf = p => CHARACTERS.find(c => c.id === p.character) || CHARACTERS[0];
const Game = {
  s: null, seenIntro: {},

  loadSettings() { try { Object.assign(this.settings, JSON.parse(localStorage.getItem('pd.settings') || '{}')); } catch (e) {} if (!DIFFS[this.settings.diff]) this.settings.diff = 'normal'; Sound.on = this.settings.sound !== false; },
  saveSettings() { this.settings.sound = Sound.on; try { localStorage.setItem('pd.settings', JSON.stringify(this.settings)); } catch (e) {} },
  newGame() {
    const level = DIFFS[this.settings.diff].level;
    const N = Setup.count, mode = N === 1 ? 'solo' : Setup.mode, types = Object.keys(Puzzles);
    const players = Setup.players.slice(0, N).map((p, i) => { const ch = chOf(p); return { i, character: ch.id, color: ch.color, name: (p.name || '').trim() || ch.name, stars: 0 }; });

        const R = Math.max(ROOMS, N), ts = shuffle(types).slice(0, Math.min(R, types.length));
        rooms = range(R).map(j => ({ type: ts[j % ts.length], player: 0, stars: null }));
      }

    });

    this.renderChips($('#map-chips'), { turn: nextP ? nextP.i : -1 });
    const box = $('#floors'); box.innerHTML = '';
    s.floors.forEach((fl, fi) => {
      const fs = fi < s.floor ? 'done' : fi === s.floor ? 'cur' : 'locked';
      const row = el('div', `floor ${fs} t-${fl.theme.id}`);
      row.appendChild(el('div', 'floor-name', `${fl.theme.icon} ${fi + 1}층 ${fl.theme.name}`));
      const doors = el('div', 'doors');
      fl.rooms.forEach((rm, ri) => {
        const ds = fi < s.floor || (fi === s.floor && ri < s.room) ? 'done' : (fi === s.floor && ri === s.room) ? 'cur' : 'locked';
        const p = s.players[rm.player], door = el('div', `door ${ds}`);
        const badge = multi ? `<span class="door-badge" style="--cc:${p.color}"><img src="${charImg(p.character)}" alt=""></span>` : '';
        door.innerHTML = badge + (ds === 'done' ? `<div class="door-face"></div><div class="door-stars">${starIcons(rm.stars || 0)}</div>`
          : ds === 'cur' ? `<div class="door-face"></div><div class="door-hero"><img src="${charImg(p.character)}" alt=""><img class="hero-torch" src="assets/ui/torch.webp" alt=""></div>`
          : `<div class="door-face"></div>`);
        doors.appendChild(door);
      });
      row.appendChild(doors); box.appendChild(row);
    });
    $('#btn-enter').textContent = (multi && nextP ? `${nextP.name} 차례! ` : '') + (s.room === 0 ? `${s.floor + 1}층 탐험 시작!` : '다음 방에 들어가기');
  },
  enterRoom() {
    const s = this.s, fl = s && s.floors[s.floor];
    if (!fl || !fl.rooms[s.room]) return;
    const p = this.roomPlayer();
    if (this.isMulti()) showModal(charImg(p.character), `${p.name} 차례!`, '디벗을 건네주고, 준비되면 눌러요.', '준비됐어!', () => this.startRoom());
    else this.startRoom();
  },
  startRoom() {
    const s = this.s, fl = s.floors[s.floor], p = this.roomPlayer(), type = fl.rooms[s.room].type, P = Puzzles[type];
    Screens.show('s-room'); Sound.play('door');
    $('#room-where').textContent = `${fl.theme.icon} ${s.floor + 1}층 · ${s.room + 1}번 방`;
    $('#room-dots').innerHTML = fl.rooms.map((_, i) => `<span class="${i < s.room ? 'done' : i === s.room ? 'cur' : ''}"></span>`).join('');
    $('#avatar').style.setProperty('--cc', p.color); $('#avatar-img').src = charImg(p.character);
    const rp = $('#room-player'); rp.classList.toggle('hidden', !this.isMulti()); rp.innerHTML = this.miniHtml(p) + p.name;
    $('#btn-hint').classList.remove('used'); $('#room-overlay').classList.add('hidden'); $('#puzzle').innerHTML = '';
    this.updateHeader(); say(P.bubble);
    if (!this.seenIntro[type]) { this.seenIntro[type] = true; showModal(P.icon, P.name, P.intro, '시작!', () => this.mountPuzzle()); }
    else this.mountPuzzle();
  },
  mountPuzzle() {
    const s = this.s, type = s.floors[s.floor].rooms[s.room].type, P = Puzzles[type];
    const cur = s.cur = { P, data: P.generate(s.level), wrong: 0, hint: false, done: false, inst: null };
    const ctx = { level: s.level, correct: () => this.onCorrect(), wrong: () => this.onWrong(), locked: () => cur.done, sfx: n => Sound.play(n) };
    cur.inst = P.mount($('#puzzle'), cur.data, ctx);
  },
  updateHeader() {
    const s = this.s, n = s.mode === 'versus' ? this.roomPlayer().stars : this.totalStars();
    $('#room-stars').innerHTML = (s.mode === 'coop' ? '함께 ' : '') + '<i class="star-img"></i> ' + n;
  },
  async onCorrect() {
    const s = this.s, cur = s && s.cur; if (!cur || cur.done) return; cur.done = true;
    const stars = (cur.wrong === 0 && !cur.hint) ? 3 : ((cur.wrong <= 1 && !cur.hint) || (cur.wrong === 0 && cur.hint)) ? 2 : 1;
    Sound.play('correct'); FX.confetti(); avatarReact('jump');
    say(pick(['정답이야! 대단해!', '우와, 맞혔어!', '멋져! 바로 그거야!', '똑똑한걸!']));
    await wait(900);
    if (this.s !== s) return; // 기다리는 사이 처음으로 나갔으면 끝
    this.finishRoom(stars, '정답!');
  },
  onWrong() {
    const s = this.s, cur = s && s.cur; if (!cur || cur.done) return; cur.wrong++;
    Sound.play('wrong'); avatarReact('oops');
    if (cur.wrong >= 3) { cur.done = true; say('괜찮아! 정답을 보여줄게.'); this.revealAndFinish(); }
    else say(pick(['앗! 다시 생각해 보자.', '음… 조금만 더!', '아깝다! 한 번 더!']) + ` (남은 기회 ${3 - cur.wrong}번)`);
  },
  async revealAndFinish() {
    const s = this.s, cur = s.cur; await wait(800);
    if (this.s !== s) return;
    if (cur.inst && cur.inst.showSolution) await cur.inst.showSolution();
    await wait(600); if (this.s !== s) return; this.finishRoom(0, '다음엔 꼭!');
  },
  finishRoom(stars, msg) {
    const s = this.s; s.floors[s.floor].rooms[s.room].stars = stars; this.roomPlayer().stars += stars; this.updateHeader(); showOverlay(stars, msg);
  },
  nextRoom() {
    const s = this.s; $('#room-overlay').classList.add('hidden');
    if (s.cur && s.cur.inst && s.cur.inst.destroy) s.cur.inst.destroy();
    s.cur = null; s.room++;
    if (s.room >= s.floors[s.floor].rooms.length) this.floorClear(); else this.showMap();
  },
  useHint() {
    const cur = this.s && this.s.cur; if (!cur || cur.done || cur.hint || !cur.inst || !cur.inst.hint) return;
    cur.hint = true; Sound.play('hint'); $('#btn-hint').classList.add('used'); say('힌트를 줄게! 잘 봐.'); cur.inst.hint();
  },
  askHome() {
    const s = this.s; if (!s) return;
    Sound.play('tap');
    const text = s.mode === 'solo' ? '지금 그만두면 모은 별이 사라져요.' : '지금 그만두면 모두가 모은 별이 사라져요.';
    showModal('assets/ui/crystal.webp', '처음 화면으로 갈까?', text, '계속 하기', null, { text: '처음으로', cb: () => this.quitToTitle() });
  },
  quitToTitle() {
    const s = this.s;
    if (s && s.cur && s.cur.inst && s.cur.inst.destroy) s.cur.inst.destroy();
    this.s = null; $('#puzzle').innerHTML = ''; $('#room-overlay').classList.add('hidden');
    setTheme('title'); Screens.show('s-title');
  },
  async floorClear() {
    const s = this.s, fl = s.floors[s.floor], floorStars = fl.rooms.reduce((a, r) => a + (r.stars || 0), 0), chest = $('#chest'), btn = $('#btn-down'), chips = $('#clear-chips');
    Screens.show('s-clear');
    $('#clear-title').textContent = `${s.floor + 1}층 클리어!`; $('#clear-stars').textContent = '0'; $('#clear-max').textContent = fl.rooms.length * 3;
    chips.classList.add('hidden'); chest.className = 'chest'; btn.classList.add('hidden'); btn.textContent = s.floor + 1 < FLOORS ? '다음 층으로 내려가기!' : '결과 보기!';
    Sound.play('door'); await wait(500);
    chest.classList.add('shake'); await wait(1200); chest.classList.remove('shake'); chest.classList.add('open'); Sound.play('chest');
    const r = chest.getBoundingClientRect(); FX.stars(r.left + r.width / 2, r.top + r.height / 3);
    countUp($('#clear-stars'), floorStars, 900);
    await wait(1000); this.renderChips(chips, { floorOnly: s.floor });
    await wait(300); btn.classList.remove('hidden');
  },
  nextFloor() { const s = this.s; if (s.floor + 1 < FLOORS) { s.floor++; s.room = 0; this.showMap(); } else this.showResult(); },
  rankRow(p, stars, rk) { return `<span class="rk">${rk}</span>${this.miniHtml(p)}<span class="nm">${p.name}</span><span><i class="star-img"></i> ${stars}</span>`; },
  showResult() {
    const s = this.s, max = this.maxStars(), total = this.totalStars(), ratio = total / max;
    let tier = ratio >= 0.8 ? 'gold' : ratio >= 0.5 ? 'silver' : 'bronze';
    setTheme('title'); Screens.show('s-result');
    const list = $('#rank-list'), big = $('#result-big'); list.innerHTML = ''; list.classList.add('hidden'); big.classList.remove('hidden');
    $('#result-max').textContent = max; $('#result-stars').textContent = '0';
    if (s.mode === 'solo') {
      $('#result-title').textContent = { gold: '금 트로피!', silver: '은 트로피!', bronze: '동 트로피!' }[tier];
      $('#result-msg').textContent = { gold: '완벽한 탐험가야! 던전의 보물은 네 거야!', silver: '훌륭해! 다음엔 금 트로피에 도전해 보자!', bronze: '던전을 끝까지 탐험했어! 다시 하면 더 잘할 수 있어!' }[tier];
    } else if (s.mode === 'coop') {
      $('#result-title').textContent = { gold: '팀 금 트로피!', silver: '팀 은 트로피!', bronze: '팀 동 트로피!' }[tier];
      $('#result-msg').textContent = { gold: '최고의 탐험대야! 힘을 합쳐 보물을 찾았어!', silver: '멋진 팀워크야! 다음엔 금 트로피에 도전해 보자!', bronze: '함께 끝까지 탐험했어! 다시 하면 더 잘할 수 있어!' }[tier];
      list.classList.remove('hidden');
      s.players.forEach(p => { const d = el('div', 'rank-row'); d.innerHTML = this.rankRow(p, p.stars, '🤝'); list.appendChild(d); });
    } else {
      tier = 'gold'; big.classList.add('hidden'); list.classList.remove('hidden');
      const sorted = s.players.slice().sort((a, b) => b.stars - a.stars);
      let rank = 0, prev = null;
      sorted.forEach((p, i) => {
        if (p.stars !== prev) { rank = i + 1; prev = p.stars; }
        const d = el('div', 'rank-row' + (rank === 1 ? ' first' : '')); d.innerHTML = this.rankRow(p, p.stars, (rank === 1 ? '👑 ' : '') + rank + '위'); list.appendChild(d);
      });
      const winners = sorted.filter(p => p.stars === sorted[0].stars);
      $('#result-title').textContent = winners.length > 1 ? `공동 1위! ${winners.map(w => w.name).join(' · ')}` : `${winners[0].name} 1위!`;
      $('#result-msg').textContent = '모두 잘했어! 다음엔 별을 더 많이 모아 보자.';
    }
    $('#trophy').className = 'trophy ' + tier; $('#trophy').src = `assets/ui/trophy-${tier}.webp`;
    countUp($('#result-stars'), total, 1400); Sound.play('fanfare'); FX.fireworks();
  }
};

/* ---------- 시작 ---------- */
function init() {
  Game.loadSettings(); FX.init(); syncSoundIcons();
  document.addEventListener('pointerdown', () => Sound.init(), { passive: true });
  document.addEventListener('contextmenu', e => e.preventDefault());
  $$('#diff button').forEach(b => { b.classList.toggle('on', b.dataset.d === Game.settings.diff); b.addEventListener('click', () => { $$('#diff button').forEach(x => x.classList.remove('on')); b.classList.add('on'); Game.settings.diff = b.dataset.d; Game.saveSettings(); Sound.play('tap'); }); });
  $$('#btn-sound, #btn-sound2').forEach(b => b.addEventListener('click', () => { Sound.on = !Sound.on; Game.saveSettings(); syncSoundIcons(); Sound.play('tap'); }));
  // 모험 준비 화면: 인원 → (방식) → 탐험가·이름
  const renderPcards = () => {
    const N = Setup.count, box = $('#pcards'); box.innerHTML = '';
    $('#mode-block').classList.toggle('hidden', N === 1);
    $('#players-label').textContent = N === 1 ? '탐험가를 골라요' : '각자 탐험가를 골라요 (이름은 안 써도 돼요)';
    range(N).forEach(i => {
      const p = Setup.players[i], card = el('div', 'pcard' + (p.character ? ' ready' : ''));
      card.innerHTML = `<div class="pcard-head"><span class="pcard-num">${N === 1 ? '탐험가' : (i + 1) + '번 탐험가'}</span><input class="pcard-name" maxlength="6" placeholder="이름"></div><div class="pcard-chars"></div>`;
      const inp = $('.pcard-name', card); inp.value = p.name; inp.addEventListener('input', () => { p.name = inp.value; });
      const chars = $('.pcard-chars', card);
      CHARACTERS.forEach(c => {
        const taken = Setup.players.slice(0, N).some((q, j) => j !== i && q.character === c.id);
        const b = el('button', 'pc' + (p.character === c.id ? ' on' : '') + (taken ? ' taken' : ''), `<img src="${charImg(c.id)}" alt="${c.name}">`);
        b.style.setProperty('--cc', c.color); b.title = c.name;
        b.addEventListener('click', () => { p.character = c.id; Sound.play('tap'); renderPcards(); });
        chars.appendChild(b);
      });
      box.appendChild(card);
    });
    $('#btn-go').disabled = !Setup.players.slice(0, N).every(p => p.character);
  };
  Setup.players[0].character = CHARACTERS.some(c => c.id === Game.settings.character) ? Game.settings.character : 'fox';
  $$('#count-row button').forEach(b => b.addEventListener('click', () => { $$('#count-row button').forEach(x => x.classList.remove('on')); b.classList.add('on'); Setup.count = +b.dataset.n; Sound.play('tap'); renderPcards(); }));
  $$('.mode-btn').forEach(b => b.addEventListener('click', () => { $$('.mode-btn').forEach(x => x.classList.remove('on')); b.classList.add('on'); Setup.mode = b.dataset.m; Sound.play('tap'); }));
  $('#btn-start').addEventListener('click', () => { Sound.play('tap'); renderPcards(); Screens.show('s-select'); });
  $('#btn-back-title').addEventListener('click', () => { Sound.play('tap'); Screens.show('s-title'); });
  $('#btn-go').addEventListener('click', () => { Game.settings.character = Setup.players[0].character; Game.saveSettings(); Sound.play('door'); Game.newGame(); });
  $('#btn-enter').addEventListener('click', () => Game.enterRoom());
  $('#btn-hint').addEventListener('click', () => Game.useHint());
  $('#btn-next').addEventListener('click', () => { Sound.play('tap'); Game.nextRoom(); });
  $('#btn-down').addEventListener('click', () => { Sound.play('tap'); Game.nextFloor(); });
  $('#btn-again').addEventListener('click', () => { Sound.play('door'); Game.newGame(); });
  $('#btn-home').addEventListener('click', () => { Sound.play('tap'); Game.quitToTitle(); });
  $('#btn-room-home').addEventListener('click', () => Game.askHome());
  $('#btn-map-home').addEventListener('click', () => Game.askHome());
  Screens.show('s-title');
  // 그림 미리 불러오기 (첫 등장 때 늦게 뜨지 않게)
  const preload = [
    ...CHARACTERS.flatMap(c => [charImg(c.id), charImg(c.id, 'happy'), charImg(c.id, 'oops')]),
    ...['chest-closed', 'chest-open', 'trophy-gold', 'trophy-silver', 'trophy-bronze', 'star', 'door-closed', 'door-locked', 'door-open', 'torch', 'bulb', 'crystal'].map(n => `assets/ui/${n}.webp`),
    ...FRUITS.map(f => `assets/fruit/${f}.webp`),
    ...['robot', 'gem', 'rock'].map(n => `assets/robot/${n}.webp`),
    ...['floor-moss', 'floor-ice', 'floor-lava'].map(n => `assets/bg/${n}.webp`),
  ];
  setTimeout(() => preload.forEach(src => { const im = new Image(); im.src = src; }), 300);
  window.PD = { Puzzles, Game, Setup, Sound, FX }; // 디버그·테스트용 접근 훅
}
init();
})();
</script>
